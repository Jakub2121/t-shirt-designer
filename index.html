<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreator Nadruków - Realistyczny Studio Mockup</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fabric.js v5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;700&family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Montserrat', sans-serif; }
    .accent-bg { background-color: #d0fd38; color: #0f172a; }
    .accent-color { color: #d0fd38; }
    
    /* Płynna zmiana koloru tła pod teksturą koszulki */
    .tshirt-color-layer {
      transition: background-color 0.3s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 p-4 bg-slate-900/80 backdrop-blur flex justify-between items-center sticky top-0 z-50">
    <h1 class="text-xl font-bold tracking-wider uppercase">Kreator <span class="accent-color">Nadruków</span></h1>
    <div class="flex gap-2">
      <button id="btn-front" onclick="switchSide('front')" class="px-5 py-2 rounded-lg font-semibold accent-bg transition-all shadow-lg">Przód</button>
      <button id="btn-back" onclick="switchSide('back')" class="px-5 py-2 rounded-lg font-semibold bg-slate-800 hover:bg-slate-700 text-white transition-all">Tył</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-4 lg:p-8 max-w-7xl mx-auto w-full">
    
    <!-- Left: Tool Panel (5 cols) -->
    <section class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-6 shadow-xl">
      
      <!-- Kolor Koszulki -->
      <div>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">1. Kolor Koszulki</h2>
        <div class="flex gap-3">
          <button onclick="changeTshirtColor('#1e293b')" class="w-9 h-9 rounded-full bg-slate-800 border-2 border-slate-500 hover:scale-110 transition shadow-md" title="Czarny"></button>
          <button onclick="changeTshirtColor('#f8fafc')" class="w-9 h-9 rounded-full bg-slate-100 border-2 border-slate-400 hover:scale-110 transition shadow-md" title="Biały"></button>
          <button onclick="changeTshirtColor('#dc2626')" class="w-9 h-9 rounded-full bg-red-600 border-2 border-red-400 hover:scale-110 transition shadow-md" title="Czerwony"></button>
          <button onclick="changeTshirtColor('#2563eb')" class="w-9 h-9 rounded-full bg-blue-600 border-2 border-blue-400 hover:scale-110 transition shadow-md" title="Niebieski"></button>
          <button onclick="changeTshirtColor('#16a34a')" class="w-9 h-9 rounded-full bg-green-600 border-2 border-green-400 hover:scale-110 transition shadow-md" title="Zielony"></button>
        </div>
      </div>

      <hr class="border-slate-800">

      <!-- Edycja Tekstu -->
      <div>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">2. Dodaj & Edytuj Tekst</h2>
        <div class="flex gap-2 mb-3">
          <input type="text" id="text-input" placeholder="Wpisz swój tekst..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#d0fd38]">
          <button onclick="addText()" class="accent-bg font-bold px-4 py-2 rounded-lg text-sm hover:opacity-90 transition">+ Dodaj</button>
        </div>
        
        <div class="grid grid-cols-2 gap-2 mb-3">
          <select id="font-family" onchange="updateTextProperty('fontFamily', this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
            <option value="Montserrat">Montserrat</option>
            <option value="Impact">Impact</option>
            <option value="Pacifico">Pacifico</option>
            <option value="Roboto">Roboto</option>
          </select>
          <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1">
            <span class="text-xs text-slate-400">Kolor:</span>
            <input type="color" id="text-color" value="#ffffff" onchange="updateTextProperty('fill', this.value)" class="bg-transparent w-full h-8 cursor-pointer border-0">
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="toggleStyle('bold')" class="flex-1 bg-slate-800 hover:bg-slate-700 font-bold border border-slate-700 rounded-lg py-2 text-sm">B (Bold)</button>
          <button onclick="toggleStyle('italic')" class="flex-1 bg-slate-800 hover:bg-slate-700 italic border border-slate-700 rounded-lg py-2 text-sm">I (Italic)</button>
        </div>
      </div>

      <hr class="border-slate-800">

      <!-- Wgrywanie Obrazu -->
      <div>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">3. Wgraj Grafikę</h2>
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-[#d0fd38] rounded-xl p-4 cursor-pointer transition bg-slate-800/50">
          <span class="text-sm text-slate-300">Dodaj plik PNG, JPG lub SVG</span>
          <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="uploadImage(event)">
        </label>
      </div>

      <hr class="border-slate-800">

      <!-- Akcje -->
      <div class="flex-1 flex flex-col justify-end gap-3">
        <button onclick="deleteSelected()" class="w-full bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 font-semibold py-2 rounded-lg text-sm transition">
          Usuń zaznaczony element
        </button>
        <button onclick="exportDesign()" class="w-full accent-bg font-bold py-3 rounded-xl text-base shadow-lg hover:opacity-90 transition">
          Pobierz Plik do Druku (SVG / PDF)
        </button>
      </div>

    </section>

    <!-- Right: Realistic Mockup Preview (7 cols) -->
    <section class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center relative min-h-[550px]">
      
      <!-- Container Mockupu -->
      <div class="relative w-[380px] h-[490px] bg-slate-950/60 rounded-2xl flex items-center justify-center shadow-2xl overflow-hidden border border-slate-800 p-4">
        
        <!-- Warstwa tła z kolorem koszulki -->
        <div id="tshirt-color-bg" class="absolute w-[340px] h-[440px] rounded-xl tshirt-color-layer bg-slate-800"></div>

        <!-- Realistyczny plik PNG z teksturą bawełny, szwami i cieniami (Multiply) -->
        <img id="tshirt-mockup-img" 
             src="https://raw.githubusercontent.com/cjdowner/tshirt-designer/master/img/crew_front.png" 
             alt="Realistyczny Mockup Koszulki" 
             class="absolute w-[340px] h-[440px] object-contain pointer-events-none z-0 mix-blend-multiply opacity-95">

        <!-- Wskaźnik Przód / Tył -->
        <span id="side-indicator" class="absolute top-4 left-4 bg-slate-900/90 border border-slate-700 text-[10px] px-3 py-1 rounded-full text-slate-300 uppercase tracking-widest font-semibold z-20">
          Widok: Przód
        </span>

        <!-- Pole Zadruku z płótnem Fabric.js (Canvas) -->
        <div class="absolute top-[105px] w-[180px] h-[260px] border-2 border-dashed border-[#d0fd38]/60 rounded flex items-center justify-center z-10 pointer-events-auto">
          <canvas id="fabric-canvas" width="180" height="260"></canvas>
        </div>

      </div>

      <p class="text-xs text-slate-500 mt-4">Wskazówka: Ramka wskazuje obszar bezpieczny dla nadruku DTF/Sito.</p>
    </section>

  </main>

  <!-- JS Logic -->
  <script>
    let canvas;
    let currentSide = 'front';
    const sideData = { front: null, back: null };

    // Adresy URL do czystych, przezroczystych mockupów z teksturą materiału
    const MOCKUPS = {
      front: 'https://raw.githubusercontent.com/cjdowner/tshirt-designer/master/img/crew_front.png',
      back: 'https://raw.githubusercontent.com/cjdowner/tshirt-designer/master/img/crew_back.png'
    };

    window.onload = () => {
      canvas = new fabric.Canvas('fabric-canvas', { preserveObjectStacking: true });

      canvas.on('selection:created', onObjectSelected);
      canvas.on('selection:updated', onObjectSelected);
      canvas.on('selection:cleared', () => {
        document.getElementById('text-input').value = '';
      });
    };

    function onObjectSelected(e) {
      const activeObj = e.selected[0];
      if (activeObj && activeObj.type === 'i-text') {
        document.getElementById('text-input').value = activeObj.text;
        document.getElementById('text-color').value = activeObj.fill;
        document.getElementById('font-family').value = activeObj.fontFamily;
      }
    }

    // Zmiana koloru koszulki pod teksturą
    function changeTshirtColor(hexColor) {
      document.getElementById('tshirt-color-bg').style.backgroundColor = hexColor;
    }

    // Dodawanie Tekstu
    function addText() {
      const input = document.getElementById('text-input');
      const textVal = input.value.trim() || "Napis";
      
      const text = new fabric.IText(textVal, {
        left: 20,
        top: 20,
        fontFamily: document.getElementById('font-family').value,
        fill: document.getElementById('text-color').value,
        fontSize: 24,
        cornerColor: '#d0fd38',
        cornerSize: 8,
        transparentCorners: false
      });

      canvas.add(text);
      canvas.setActiveObject(text);
      canvas.renderAll();
    }

    function updateTextProperty(prop, value) {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'i-text') {
        activeObj.set(prop, value);
        canvas.renderAll();
      }
    }

    function toggleStyle(styleType) {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'i-text') {
        if (styleType === 'bold') {
          activeObj.set('fontWeight', activeObj.fontWeight === 'bold' ? 'normal' : 'bold');
        } else if (styleType === 'italic') {
          activeObj.set('fontStyle', activeObj.fontStyle === 'italic' ? 'normal' : 'italic');
        }
        canvas.renderAll();
      }
    }

    // Wgrywanie Grafiki
    function uploadImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(f) {
        fabric.Image.fromURL(f.target.result, function(img) {
          img.scaleToWidth(130);
          img.set({
            left: 25,
            top: 25,
            cornerColor: '#d0fd38',
            cornerSize: 8,
            transparentCorners: false
          });
          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();
        });
      };
      reader.readAsDataURL(file);
    }

    function deleteSelected() {
      const activeObj = canvas.getActiveObject();
      if (activeObj) {
        canvas.remove(activeObj);
        canvas.discardActiveObject();
        canvas.renderAll();
      }
    }

    // Przełączanie stron (Przód / Tył)
    function switchSide(side) {
      if (currentSide === side) return;

      // Zapisujemy stan strony
      sideData[currentSide] = canvas.toJSON();
      currentSide = side;

      // Zmiana obrazu mockupu na właściwą stronę
      document.getElementById('tshirt-mockup-img').src = MOCKUPS[side];
      document.getElementById('side-indicator').innerText = `Widok: ${side === 'front' ? 'Przód' : 'Tył'}`;

      const btnFront = document.getElementById('btn-front');
      const btnBack = document.getElementById('btn-back');
      
      if (side === 'front') {
        btnFront.className = "px-5 py-2 rounded-lg font-semibold accent-bg transition-all shadow-lg";
        btnBack.className = "px-5 py-2 rounded-lg font-semibold bg-slate-800 hover:bg-slate-700 text-white transition-all";
      } else {
        btnBack.className = "px-5 py-2 rounded-lg font-semibold accent-bg transition-all shadow-lg";
        btnFront.className = "px-5 py-2 rounded-lg font-semibold bg-slate-800 hover:bg-slate-700 text-white transition-all";
      }

      // Odświeżenie płótna dla nowej strony
      canvas.clear();
      if (sideData[side]) {
        canvas.loadFromJSON(sideData[side], canvas.renderAll.bind(canvas));
      } else {
        canvas.renderAll();
      }
    }

    // Eksportowanie nadruku
    function exportDesign() {
      const objects = canvas.getObjects();
      if (objects.length === 0) {
        alert("Pole zadruku jest puste!");
        return;
      }

      const hasRasterImage = objects.some(obj => obj.type === 'image');

      if (!hasRasterImage) {
        const svgData = canvas.toSVG();
        const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `nadruk_${currentSide}.svg`;
        link.click();
      } else {
        const imgData = canvas.toDataURL({ format: 'png', multiplier: 3 });
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [180, 260] });
        pdf.addImage(imgData, 'PNG', 0, 0, 180, 260);
        pdf.save(`nadruk_${currentSide}.pdf`);
      }
    }
  </script>
</body>
</html>
