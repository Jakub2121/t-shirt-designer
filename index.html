<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreator Nadruków - Studio</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fabric.js v5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Impact&family=Montserrat:wght@400;700&family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Montserrat', sans-serif; }
    .accent-color { color: #d0fd38; }
    .accent-bg { background-color: #d0fd38; color: #0f172a; }
    .accent-border { border-color: #d0fd38; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 p-4 bg-slate-900/50 backdrop-blur flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wider uppercase">Kreator <span class="accent-color">Nadruków</span></h1>
    <div class="flex gap-2">
      <button id="btn-front" onclick="switchSide('front')" class="px-4 py-2 rounded-lg font-semibold accent-bg transition-all">Przód</button>
      <button id="btn-back" onclick="switchSide('back')" class="px-4 py-2 rounded-lg font-semibold bg-slate-800 hover:bg-slate-700 text-white transition-all">Tył</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-4 lg:p-8 max-w-7xl mx-auto w-full">
    
    <!-- Left: Tool Panel (5 cols) -->
    <section class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col gap-6 shadow-xl">
      
      <!-- Tekst Section -->
      <div>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">1. Dodaj & Edytuj Tekst</h2>
        <div class="flex gap-2 mb-3">
          <input type="text" id="text-input" placeholder="Wpisz swój tekst..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#d0fd38]">
          <button onclick="addText()" class="accent-bg font-bold px-4 py-2 rounded-lg text-sm hover:opacity-90 transition">+ Dodaj</button>
        </div>
        
        <!-- Style Tekstu -->
        <div class="grid grid-cols-2 gap-2 mb-3">
          <select id="font-family" onchange="updateTextProperty('fontFamily', this.value)" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm">
            <option value="Montserrat">Montserrat</option>
            <option value="Impact">Impact</option>
            <option value="Pacifico">Pacifico</option>
            <option value="Roboto">Roboto</option>
          </select>
          <div class="flex items-center gap-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1">
            <span class="text-xs text-slate-400">Kolor:</span>
            <input type="color" id="text-color" value="#ffffff" onchange="updateTextProperty('fill', this.value)" class="bg-transparent w-full h-8 cursor-pointer border-0">
          </div>
        </div>

        <div class="flex gap-2">
          <button onclick="toggleStyle('bold')" class="flex-1 bg-slate-800 hover:bg-slate-700 font-bold border border-slate-700 rounded-lg py-2 text-sm">B (Bold)</button>
          <button onclick="toggleStyle('italic')" class="flex-1 bg-slate-800 hover:bg-slate-700 italic border border-slate-700 rounded-lg py-2 text-sm">I (Italic)</button>
        </div>
      </div>

      <hr class="border-slate-800">

      <!-- Grafika Section -->
      <div>
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">2. Wgraj Grafikę</h2>
        <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-[#d0fd38] rounded-xl p-4 cursor-pointer transition bg-slate-800/50">
          <span class="text-sm text-slate-300">Kliknij, aby dodać obraz (PNG, JPG, SVG)</span>
          <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="uploadImage(event)">
        </label>
      </div>

      <hr class="border-slate-800">

      <!-- Zarządzanie Warstwami & Akcje -->
      <div class="flex-1 flex flex-col justify-end gap-3">
        <button onclick="deleteSelected()" class="w-full bg-red-500/10 text-red-400 border border-red-500/20 hover:bg-red-500/20 font-semibold py-2 rounded-lg text-sm transition">
          Usuń zaznaczony element
        </button>
        <button onclick="exportDesign()" class="w-full accent-bg font-bold py-3 rounded-xl text-base shadow-lg hover:opacity-90 transition">
          Pobierz Plik do Druku (SVG / PDF)
        </button>
      </div>

    </section>

    <!-- Right: Mockup Preview (7 cols) -->
    <section class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center justify-center relative min-h-[500px]">
      
      <!-- Mockup Wrapper -->
      <div class="relative w-[380px] h-[480px] bg-slate-800/40 rounded-xl flex items-center justify-center shadow-2xl overflow-hidden border border-slate-800">
        
        <!-- T-Shirt Background SVG Silhouette -->
        <svg id="tshirt-svg" class="absolute w-[340px] h-[440px] text-slate-700 transition-all duration-300 fill-current" viewBox="0 0 24 24">
          <path d="M12 4.218c-1.07 1.07-2.6 1.782-4.25 1.782h-3.5l-2.25 4.5 3 1.5v9h14v-9l3-1.5-2.25-4.5h-3.5c-1.65 0-3.18-.712-4.25-1.782z"/>
        </svg>

        <!-- Label Przód / Tył -->
        <span id="side-indicator" class="absolute top-4 left-4 bg-slate-900/80 border border-slate-700 text-xs px-3 py-1 rounded-full text-slate-300 uppercase tracking-widest font-semibold">
          Widok: Przód
        </span>

        <!-- Canvas Print Area Overlay -->
        <div class="absolute w-[200px] h-[280px] border-2 border-dashed border-[#d0fd38]/60 rounded flex items-center justify-center z-10 pointer-events-auto">
          <canvas id="fabric-canvas" width="200" height="280"></canvas>
        </div>

      </div>

      <p class="text-xs text-slate-500 mt-4">Wskazówka: Użyj uchwytów myszy, aby przesuwać, skalować i obracać elementy wewnątrz zielonej ramki zadruku.</p>
    </section>

  </main>

  <!-- JS Logic -->
  <script>
    let canvas;
    let currentSide = 'front';
    const sideData = {
      front: null,
      back: null
    };

    // Inicjalizacja Fabric Canvas
    window.onload = () => {
      canvas = new fabric.Canvas('fabric-canvas', {
        preserveObjectStacking: true
      });

      // Synchronizacja inputa tekstowego przy zaznaczeniu obiektu
      canvas.on('selection:created', onObjectSelected);
      canvas.on('selection:updated', onObjectSelected);
      canvas.on('selection:cleared', () => {
        document.getElementById('text-input').value = '';
      });
    };

    function onObjectSelected(e) {
      const activeObj = e.selected[0];
      if (activeObj && activeObj.type === 'i-text') {
        document.getElementById('text-input').value = activeObj.text;
        document.getElementById('text-color').value = activeObj.fill;
        document.getElementById('font-family').value = activeObj.fontFamily;
      }
    }

    // 1. Dodawanie Tekstu
    function addText() {
      const input = document.getElementById('text-input');
      const textVal = input.value.trim() || "Twój Tekst";
      
      const text = new fabric.IText(textVal, {
        left: 20,
        top: 20,
        fontFamily: document.getElementById('font-family').value,
        fill: document.getElementById('text-color').value,
        fontSize: 24,
        cornerColor: '#d0fd38',
        cornerSize: 8,
        transparentCorners: false
      });

      canvas.add(text);
      canvas.setActiveObject(text);
      canvas.renderAll();
    }

    // Aktualizacja właściwości tekstu w czasie rzeczywistym
    function updateTextProperty(prop, value) {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'i-text') {
        activeObj.set(prop, value);
        canvas.renderAll();
      }
    }

    function toggleStyle(styleType) {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'i-text') {
        if (styleType === 'bold') {
          activeObj.set('fontWeight', activeObj.fontWeight === 'bold' ? 'normal' : 'bold');
        } else if (styleType === 'italic') {
          activeObj.set('fontStyle', activeObj.fontStyle === 'italic' ? 'normal' : 'italic');
        }
        canvas.renderAll();
      }
    }

    // 2. Wgrywanie Grafiki
    function uploadImage(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(f) {
        fabric.Image.fromURL(f.target.result, function(img) {
          // Automatyczne dopasowanie wielkości grafiki do pola zadruku
          img.scaleToWidth(140);
          img.set({
            left: 30,
            top: 30,
            cornerColor: '#d0fd38',
            cornerSize: 8,
            transparentCorners: false
          });
          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();
        });
      };
      reader.readAsDataURL(file);
    }

    // Usuwanie zaznaczonego elementu
    function deleteSelected() {
      const activeObj = canvas.getActiveObject();
      if (activeObj) {
        canvas.remove(activeObj);
        canvas.discardActiveObject();
        canvas.renderAll();
      }
    }

    // Przełączanie stron Przód / Tył
    function switchSide(side) {
      if (currentSide === side) return;

      // Zapisujemy stan obecnej strony
      sideData[currentSide] = canvas.toJSON();

      currentSide = side;
      document.getElementById('side-indicator').innerText = `Widok: ${side === 'front' ? 'Przód' : 'Tył'}`;

      // Stylizacja przycisków
      const btnFront = document.getElementById('btn-front');
      const btnBack = document.getElementById('btn-back');
      
      if (side === 'front') {
        btnFront.className = "px-4 py-2 rounded-lg font-semibold accent-bg transition-all";
        btnBack.className = "px-4 py-2 rounded-lg font-semibold bg-slate-800 hover:bg-slate-700 text-white transition-all";
      } else {
        btnBack.className = "px-4 py-2 rounded-lg font-semibold accent-bg transition-all";
        btnFront.className = "px-4 py-2 rounded-lg font-semibold bg-slate-800 hover:bg-slate-700 text-white transition-all";
      }

      // Wczytanie stanu nowej strony
      canvas.clear();
      if (sideData[side]) {
        canvas.loadFromJSON(sideData[side], canvas.renderAll.bind(canvas));
      } else {
        canvas.renderAll();
      }
    }

    // Eksport do pliku (SVG lub PDF zależnie od zawartości)
    function exportDesign() {
      const objects = canvas.getObjects();
      if (objects.length === 0) {
        alert("Pole zadruku jest puste!");
        return;
      }

      const hasRasterImage = objects.some(obj => obj.type === 'image');

      if (!hasRasterImage) {
        // Eksport do czystego wektorowego SVG
        const svgData = canvas.toSVG();
        const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `nadruk_${currentSide}.svg`;
        link.click();
      } else {
        // Eksport do PDF (wysoka jakość)
        const imgData = canvas.toDataURL({ format: 'png', multiplier: 3 });
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: [200, 280]
        });
        pdf.addImage(imgData, 'PNG', 0, 0, 200, 280);
        pdf.save(`nadruk_${currentSide}.pdf`);
      }
    }
  </script>
</body>
</html>
